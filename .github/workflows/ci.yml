name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      # Content-addressed variant id invariants (BACKLOG item 02); fast.
      - run: npm run test-cid
      # Team evaluator (BACKLOG item 08): parser parity, type/tag/RNG/BST
      # rules, damage-source oracle, variant matching, taxonomy-rot gate.
      - run: npm run test-evaluator
      # Shared effect taxonomy (BACKLOG item 11): display-group totality, the
      # Wide/Quick Guard placement rule, and that the teambuilder re-exports
      # the shared tables rather than keeping a copy.
      - run: npm run test-effects
      # Incremental matrix refresh (BACKLOG item 03): diff categories, reuse
      # arithmetic, crash resumption, pruning, and the sqlite v2 -> v3 upgrade.
      # Hermetic — builds its own temporary databases, no dex, no fixtures.
      - run: npm run test-refresh
      # Endgame test suite (BACKLOG item 01): deterministic policy benchmarks
      # gated against data/endgame-baseline.json — any regression fails.
      - run: npm run endgame-suite
